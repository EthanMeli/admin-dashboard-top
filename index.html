<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="header-top">
        <div class="search">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>magnify</title><path d="M9.5,3A6.5,6.5 0 0,1 16,9.5C16,11.11 15.41,12.59 14.44,13.73L14.71,14H15.5L20.5,19L19,20.5L14,15.5V14.71L13.73,14.44C12.59,15.41 11.11,16 9.5,16A6.5,6.5 0 0,1 3,9.5A6.5,6.5 0 0,1 9.5,3M9.5,5C7,5 5,7 5,9.5C5,12 7,14 9.5,14C12,14 14,12 14,9.5C14,7 12,5 9.5,5Z" /></svg>
          <form>
            <input id="search-input" name="search-input">
          </form>
        </div>
        <div class="header-right">
          <svg class="notifications-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>bell-outline</title><path d="M10 21H14C14 22.1 13.1 23 12 23S10 22.1 10 21M21 19V20H3V19L5 17V11C5 7.9 7 5.2 10 4.3V4C10 2.9 10.9 2 12 2S14 2.9 14 4V4.3C17 5.2 19 7.9 19 11V17L21 19M17 11C17 8.2 14.8 6 12 6S7 8.2 7 11V18H17V11Z" /></svg>
          <img class="header-profile-pic" src="" alt="Profile Picture">
          <div class="header-username">Ethan Meli</div>
        </div>
      </div>
      <div class="header-bottom">
        <div class="greeting-container">
          <img class="greeting-profile-pic" src="" alt="Profile Picture">
          <div class="greeting-text">
            <p>Hi there,</p>
            <h1>Ethan Meli (@ethan)</h1>
          </div>
        </div>
        <div class="buttons">
          <button>New</button>
          <button>Upload</button>
          <button>Share</button>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="side-item">
        <h1>Dashboard</h1>
      </div>
      <div class="navigation">
        <div class="side-item">
          <h2>Home</h2>
        </div>
        <div class="side-item">
          <h2>Profile</h2> 
        </div>
        <div class="side-item">
          <h2>Messages</h2>
        </div>
        <div class="side-item">
          <h2>History</h2>
        </div>
        <div class="side-item">
          <h2>Tasks</h2>
        </div>
        <div class="side-item">
          <h2>Communities</h2>
        </div>
      </div>
      <div class="utilities">
        <div class="side-item">
          <h2>Settings</h2>
        </div>
        <div class="side-item">
          <h2>Support</h2>
        </div>
        <div class="side-item">
          <h2>Privacy</h2>
        </div>
      </div>
    </div>

    <div class="card-container">
      <div class="projects">

      </div>
      <div class="announcements">

      </div>
      <div class="trending">

      </div>
    </div>
  </div>
</body>
</html>
